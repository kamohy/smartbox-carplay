name: Check analysis tools and update UI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_update.js
      - run: node tests/test_diagnostics.js
      - run: node tests/test_settings.js
      - run: sh -n web-ui/cgi-bin/bh-diagnostics.cgi
      - run: sh -n firmware-overlay/app/bh-log-recorder.sh
      - run: sh -n maintenance-overlay/ota/www/cgi-bin/bh-diagnostics.cgi
      - run: sh -n maintenance-overlay/app/bh-log-recorder.sh
      - run: sh -n maintenance-overlay/app/lyLink.sh
      - run: node --check maintenance-overlay/ota/www/js/bh-maintenance.js
