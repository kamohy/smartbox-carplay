<script>
	var mData = { model: {}, icon: {}};
	var miclb = ['Default', 'Mode 1'];
	var ledlb = ['开启', '关闭'];
	var audlb = ['Default', 'Mode 1', 'Mode 2', 'Mode 3'];
	var dlylb = ['Default', 'Mode 1', 'Mode 2'];
	window.onload = my_onload;

	function si(i,n) {
		var d = document.getElementById(i);
		if (d) d.innerHTML = n;
	}

	function hd(n,v,a,h) {
		var d = document.getElementById(n);
		if (d) {
			for (var i of a.split(',')) { 
				if (i == v) {
					h = !h;
					break;
				}
			}
			if (h) d.style.display = 'none';
		}
	}

	function hp(i) {
		var d = document.getElementById(i);
		if (d) d.parentElement.className = 'hide';
	}

	function hdaud(v) {
		var a = '1284,1502,1334,1301,1335,1501,1344,1345,1119,1260,1263,1348,1350,1510,1511,1517,1518,1533,1534,1535,1537,1538,1539,1543,2344,2345,2348,2539,2517,1503,2562,3301,3303,2726,2863,2864,2865,2866,2869';
		var d = document.getElementById('div_aud');
		if (d) {
			for (var i of a.split(',')) { 
				if (i == v) {
					return;
				}
			}
			
			if((v > '5000' && v < '5061')) {
				return;
			}
			else if((v > '5100' && v < '5300')) {
				return;
			}
			else if((v > '6000' && v < '6051')) {
				return;
			} 
			else if(v > '6070') {
				return;
			}
			
			d.style.display = 'none';
		}
	}

	function hdwif(v) {
		var a = '1501,1512,1506,1533,1534,1535,1536,1537,1538,1503,2562';
		var d = document.getElementById('div_wif');
		if (d) {
			for (var i of a.split(',')) { 
				if (i == v) {
					return;
				}
			}
			
			if((v > '5001' && v < '5300')) {
				return;
			}
			else if(v > '6000') {
				return;
			} 
			
			d.style.display = 'none';
		}
	}

	function hdmic(v) {
		var a = '1332,1333,1302,1343,1349,1520,2343,2860,2862,2871,2873,3302,3304,2867,2859,3305';
		var d = document.getElementById('div_mic');
		if (d) {
			for (var i of a.split(',')) { 
				if (i == v) {
					return;
				}
			}
			if (v > '2650' && v < '2660') {
				return;
			}
			d.style.display = 'none';
		}
	}

	function hdvid(v) {
		var a = '1284,1502,1333,1301,1335,1343,1332,1119,1349,1350,1520,2343,2860,2862,2861,2866,3301,3302,2865,3303,3304,2869,2867,2859,3305,2726';
		var d = document.getElementById('div_vid');
		if (d) {
			for (var i of a.split(',')) { 
				if (i == v) {
					return;
				}
			}
			if (v > '2650' && v < '2660') {
				return;
			}
			d.style.display = 'none';
		}
	}

	function hdconn(v) {
		var a = '1333,1343,1332,1349,1520,2343,2860,2862,3302,3304,2867,2859,3305';
		var d = document.getElementById('div_conn');
		if (d) {
			for (var i of a.split(',')) { 
				if (i == v) {
					return;
				}
			}
			if (v > '2650' && v < '2660') {
				return;
			}
			d.style.display = 'none';
		}
	}

	function hdgps(v) {
		var a = '1333,1501,1344';
		var d = document.getElementById('div_gps');
		if (d) {
			for (var i of a.split(',')) { 
				if (i == v) {
					return;
				}
			}
			
			if((v > '5000' && v < '5061')) {
				return;
			}
			else if((v > '5100' && v < '5300')) {
				return;
			}
			else if((v > '6000' && v < '6051')) {
				return;
			} 
			else if(v > '6070') {
				return;
			}
			d.style.display = 'none';
		}
	}

	function hdled(v) {
		var a = '2721,2723,2724,2865,2806,2807,2808,2810,2812,2814,2772';
		var d = document.getElementById('div_led');
		if (d) {
			for (var i of a.split(',')) { 
				if (i == v) {
					return;
				}
			}
			if((v > '5001')) {
				return;
			}
			d.className = 'hide';
		}
	}

	function hdled2(v) {
		var a = '2859,2734,2872,2873,3301,3302,3303,3304,3305';
		var d = document.getElementById('div_led2');
		if (d) {
			for (var i of a.split(',')) { 
				if (i == v) {
					return;
				}
			}
			d.className = 'hide';
		}
	}

	function setValue(v,n,hd=false) {
		if (v != null) {
			si(n, v);
		} else if (hd) {
			hp(n);
		}
	}

	function setIndex(i,n,a=miclb,hd=false) {
		if (i != null && i < a.length) {
			si(n,a[i]);
		} else if (hd) {
			hp(n);
		}
	}

	var appver = "";
	function my_onload() {
		go_tpl("tpl_home");
		fetch("/cgi-bin/index.cgi?id=host").then(r => r.json()).then(j => {
			var rs = j.res;
			if (j.sys != null && j.sys.appver != null) {
				if (j.update == 4) {
					mData.appver = '00000000' + j.sys.appver.substr(8);
				} else {
					mData.appver = j.sys.appver;
				}
				appver = j.sys.appver.slice(-6, -2);
			} else {
				mData.appver = "0";
			}
			hd('ly1301',appver,'1301',true);
			if (appver != '1260') { document.styleSheets[0].addRule('.log7', 'display: none'); }
			//hd('div_mic',appver,'1332,1333,1302,1343,1349,1520,2343',true);
			hd('div_mouse',appver,'1350,2861,2866,3301,3303,2869,2865',true);
			hd('div_icon',appver,'1349,2871,2873',true);
			//hd('div_vid',appver,'1284,1502,1333,1301,1335,1343,1332,1119,1349,1350,1520,2343,2860',true);
			//hd('div_conn',appver,'1333,1343,1332,1349,1520,2343',true);
			hdaud(appver);
			hdwif(appver);
			hdmic(appver);
			hdvid(appver);
			hdconn(appver);
			hdgps(appver);
			hdled(appver);
			hdled2(appver);
			hd('div_dis',appver,'2870,2872',true);
			document.getElementById('div_mod').style.display = "none";
			si("fw_no", mData.appver);
			for (var i = 0; i < rs.txt.length; i++) { si("txt" + i, rs.txt[i]); }
			for (var key in rs.fix) {
				var ele = document.getElementById('txt_' + key);
				if (ele) { ele.placeholder = rs.fix[key]; }
			}
			if (rs.model != null) { mData.model = rs.model; }
			if (rs.icon != null) { mData.icon = rs.icon; }
			if (j.sn == null) {
				mData.sn = '##';
			} else {
				mData.sn = j.sn;
			}
			if (j.bt != null) { mData.bt = j.bt; }
			if (j.wifi != null) { mData.wifi = j.wifi; }
			if (j.model != null) {
				var model = '';
				if (j.model in mData.model) {
					model = mData.model[j.model]; 
				} else if ('NA' in mData.model) {
					model = mData.model['NA']; 
				}
				si('model', model);
			}
			if (j.mic != null && j.mic < miclb.length) { 
				si('mic', miclb[j.mic]); 
				si('mouse', miclb[j.mic]); 
			}
			if (j.icon == null) {
				document.getElementById('div_icon').style.display = "none";
			} else {
				var icon = '';
				if (j.icon in mData.icon) {
					icon = mData.icon[j.icon]; 
				} else if ('home' in mData.icon) {
					icon = mData.icon['home']; 
				}
				si('icon', icon);
			}
			setValue(j.otp, "time", true);
			setIndex(j.vid, "vid");
			setIndex(j.aud, "aud", audlb);
			setIndex(j.delay, "delay", dlylb);
			setIndex(j.gps, "gps");
			setValue(j.sig, "wifi");
			if (j.conn === "adb") { si('conn', "ADB"); }
			setIndex(j.hicar, "hicar", miclb, true);
			setIndex(j.led, "led");
			setIndex(j.led, "led2", ledlb);
			setIndex(j.display, "display");
			cpbox_init(j);
			if ('aa' in j) {
				si('aav', rs.txt[17]);
				setaa(j);
			} else {
				hp('aa');
			}
			queryNewVer();
		}).catch(e => {
			si("container", e);
			setTimeout(my_onload, 3000);
		});

	function setaa(j) {
		if (j.aa.length == 8 && j.aa[0] == '2') {
            si('aa', miclb[0]);
		} else {
            si('aa', miclb[1]);
        }
        if (j.aa.length > 0) {
            var t = '2' + j.aa.substr(1);
            var now = new Date();
            var B = '';
            var C = '';
            if (now.getUTCMonth() == 11) {
                B += (now.getUTCFullYear() + 1) * 10000 + 100 + now.getUTCDate();
            } else {
                B += now.getUTCFullYear() * 10000 + (now.getUTCMonth() + 2) * 100 + now.getUTCDate();
            }
            C += (now.getUTCFullYear() + 1) * 10000 + (now.getUTCMonth() + 1) * 100 + now.getUTCDate();
            if (t < B || t > C) {
                aa_update();
            }
        }
	}

	function setfwurl(j) {
		if (j.test != null && mData.sn != null && mData.wifi != null) {
			var str = mData.sn + mData.wifi.replace(/:/g, '');
			for (var test of j.test) {
				if (test.sn != null) {
					for (var sn of test.sn.split(',')) {
						if (sn == str.slice(- sn.length)) {
							if (test.appver > mData.appver) {
								console.log("test version: " + test.appver);
								showNewVer(test);
							} else {
								showNewVer({});
							}
							return;
						}
					}
				}
			}
		}
		if (j.appver > mData.appver) {
			console.log("new ver: " + j.appver);
			showNewVer(j);
		} else {
			showNewVer({});
		}
	}
